name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      versionName: ${{ steps.build.outputs.versionName }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --update > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" || \
            echo "::warning::sdkmanager could not install SDK components; AGP will download them during the build"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore signing keystore (if secret configured)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > paddington.keystore
            echo "Signing keystore restored from secret."
          else
            echo "No KEYSTORE_B64 secret set; generating a throwaway keystore."
            keytool -genkeypair -keystore paddington.keystore -storepass paddington \
              -keypass paddington -alias paddington -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Paddington, OU=paddington, O=paddington"
          fi

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v ]]; then
            VER="${GITHUB_REF_NAME#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
            echo "versionName=$VER" >> "$GITHUB_OUTPUT"
            echo "versionCode=$((MAJOR*10000 + MINOR*100 + PATCH))" >> "$GITHUB_OUTPUT"
          else
            echo "versionName=0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "versionCode=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        id: build
        working-directory: app
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            -PversionName=${{ steps.version.outputs.versionName }} \
            -PversionCode=${{ steps.version.outputs.versionCode }}
          echo "versionName=${{ steps.version.outputs.versionName }}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: paddington-apk
          path: app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: paddington-apk
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/app-release.apk
          generate_release_notes: true
